<svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- background -->
  <rect width="1000" height="860" fill="#f7f9fc"/>
  <!-- title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4a">多 Agent 投研系统 · 技术框架图</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" fill="#607089">LangGraph 编排 + 五角色 Agent + 动态知识图谱/GraphRAG + Harness 工程层</text>

  <!-- ===== L1 用户/调度与触发层 ===== -->
  <rect x="180" y="78" width="780" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <rect x="20" y="78" width="150" height="92" rx="10" fill="#4285f4"/>
  <text x="95" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">用户 / 调度</text>
  <text x="95" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">与触发层</text>
  <g font-size="12" fill="#1a3a6b">
    <rect x="188" y="98" width="148" height="48" rx="8" fill="#fff" stroke="#4285f4"/><text x="262" y="118" text-anchor="middle">定时调度</text><text x="262" y="136" text-anchor="middle" fill="#5b7bb0">cron 盘前/收盘</text>
    <rect x="344" y="98" width="148" height="48" rx="8" fill="#fff" stroke="#4285f4"/><text x="418" y="118" text-anchor="middle">事件触发</text><text x="418" y="136" text-anchor="middle" fill="#5b7bb0">公告/新闻/宏观</text>
    <rect x="500" y="98" width="148" height="48" rx="8" fill="#fff" stroke="#4285f4"/><text x="574" y="118" text-anchor="middle">人工一键触发</text><text x="574" y="136" text-anchor="middle" fill="#5b7bb0">手动跑图</text>
    <rect x="656" y="98" width="148" height="48" rx="8" fill="#fff" stroke="#4285f4"/><text x="730" y="118" text-anchor="middle">invoke / astream</text><text x="730" y="136" text-anchor="middle" fill="#5b7bb0">LangGraph 入口</text>
    <rect x="812" y="98" width="148" height="48" rx="8" fill="#fff" stroke="#4285f4"/><text x="886" y="118" text-anchor="middle">监控面板</text><text x="886" y="136" text-anchor="middle" fill="#5b7bb0">Studio/自研</text>
  </g>

  <!-- ===== L2 LangGraph 编排层 ===== -->
  <rect x="180" y="186" width="780" height="100" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <rect x="20" y="186" width="150" height="100" rx="10" fill="#34a853"/>
  <text x="95" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">LangGraph</text>
  <text x="95" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">编排层</text>
  <g font-size="12" fill="#14532d">
    <rect x="188" y="206" width="148" height="48" rx="8" fill="#fff" stroke="#34a853"/><text x="262" y="226" text-anchor="middle">StateGraph</text><text x="262" y="244" text-anchor="middle" fill="#3a8a52">节点 = 角色</text>
    <rect x="344" y="206" width="148" height="48" rx="8" fill="#fff" stroke="#34a853"/><text x="418" y="226" text-anchor="middle">条件边</text><text x="418" y="244" text-anchor="middle" fill="#3a8a52">风控审批</text>
    <rect x="500" y="206" width="148" height="48" rx="8" fill="#fff" stroke="#34a853"/><text x="574" y="226" text-anchor="middle">风控驳回循环</text><text x="574" y="244" text-anchor="middle" fill="#3a8a52">≤ N 次防死锁</text>
    <rect x="656" y="206" width="148" height="48" rx="8" fill="#fff" stroke="#34a853"/><text x="730" y="226" text-anchor="middle">HITL 检查点</text><text x="730" y="244" text-anchor="middle" fill="#3a8a52">interrupt()</text>
    <rect x="812" y="206" width="148" height="48" rx="8" fill="#fff" stroke="#34a853"/><text x="886" y="226" text-anchor="middle">checkpointer</text><text x="886" y="244" text-anchor="middle" fill="#3a8a52">续跑/审计</text>
  </g>

  <!-- ===== L3 角色层 ===== -->
  <rect x="180" y="302" width="780" height="150" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <rect x="20" y="302" width="150" height="150" rx="10" fill="#f9ab00"/>
  <text x="95" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">角色层</text>
  <text x="95" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">(5 Agent)</text>
  <text x="95" y="410" text-anchor="middle" font-size="11" fill="#fff">+ 入口/复盘</text>
  <!-- support small chips -->
  <g font-size="11" fill="#7a5200">
    <rect x="188" y="312" width="220" height="32" rx="8" fill="#fff7e0" stroke="#f9ab00"/><text x="298" y="333" text-anchor="middle" font-weight="bold">标的筛选 / 触发（Universe 入口）</text>
    <rect x="772" y="312" width="188" height="32" rx="8" fill="#fff7e0" stroke="#f9ab00"/><text x="866" y="333" text-anchor="middle" font-weight="bold">复盘 Agent（学习闭环）</text>
  </g>
  <!-- 5 main agents -->
  <g font-size="12" fill="#7a3e00" text-anchor="middle">
    <rect x="188" y="356" width="148" height="78" rx="8" fill="#fff" stroke="#f9ab00"/><text x="262" y="382" font-weight="bold">宏观研究员</text><text x="262" y="402" fill="#9a6a1a">大盘走势研判</text><text x="262" y="420" fill="#9a6a1a">仓位上限建议</text>
    <rect x="344" y="356" width="148" height="78" rx="8" fill="#fff" stroke="#f9ab00"/><text x="418" y="382" font-weight="bold">行业研究员</text><text x="418" y="402" fill="#9a6a1a">复用穿透叙事 skill</text><text x="418" y="420" fill="#9a6a1a">评级 + 隐含 L</text>
    <rect x="500" y="356" width="148" height="78" rx="8" fill="#fff" stroke="#f9ab00"/><text x="574" y="382" font-weight="bold">投资经理</text><text x="574" y="402" fill="#9a6a1a">组合层聚合</text><text x="574" y="420" fill="#9a6a1a">止损止盈/投决</text>
    <rect x="656" y="356" width="148" height="78" rx="8" fill="#fff" stroke="#f9ab00"/><text x="730" y="382" font-weight="bold">风控</text><text x="730" y="402" fill="#9a6a1a">硬约束 + 软约束</text><text x="730" y="420" fill="#9a6a1a">VaR/回撤/集中度</text>
    <rect x="812" y="356" width="148" height="78" rx="8" fill="#fff" stroke="#f9ab00"/><text x="886" y="382" font-weight="bold">交易员</text><text x="886" y="402" fill="#9a6a1a">TWAP/VWAP 拆单</text><text x="886" y="420" fill="#9a6a1a">降市场冲击</text>
  </g>

  <!-- ===== L4 记忆/检索层 ===== -->
  <rect x="180" y="468" width="780" height="96" rx="10" fill="#fce8f3" stroke="#e8719c" stroke-width="1.5"/>
  <rect x="20" y="468" width="150" height="96" rx="10" fill="#e8719c"/>
  <text x="95" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">记忆 / 检索</text>
  <text x="95" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">层</text>
  <g font-size="12" fill="#8a1a4a">
    <rect x="188" y="488" width="248" height="56" rx="8" fill="#fff" stroke="#e8719c"/><text x="312" y="512" text-anchor="middle">动态知识图谱</text><text x="312" y="532" text-anchor="middle" fill="#b5487a">networkx → Neo4j</text>
    <rect x="452" y="488" width="248" height="56" rx="8" fill="#fff" stroke="#e8719c"/><text x="576" y="512" text-anchor="middle">GraphRAG</text><text x="576" y="532" text-anchor="middle" fill="#b5487a">子图 + 向量混合检索</text>
    <rect x="716" y="488" width="244" height="56" rx="8" fill="#fff" stroke="#e8719c"/><text x="838" y="512" text-anchor="middle">机构记忆（全局共享）</text><text x="838" y="532" text-anchor="middle" fill="#b5487a">所有角色可见</text>
  </g>

  <!-- ===== L5 数据层 ===== -->
  <rect x="180" y="580" width="780" height="112" rx="10" fill="#eef1f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <rect x="20" y="580" width="150" height="112" rx="10" fill="#9aa0a6"/>
  <text x="95" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">数据层</text>
  <text x="95" y="642" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">（连通性）</text>
  <g font-size="12" fill="#3c4043">
    <rect x="188" y="600" width="148" height="48" rx="8" fill="#fff" stroke="#9aa0a6"/><text x="262" y="620" text-anchor="middle">行情 / 指数</text><text x="262" y="638" text-anchor="middle" fill="#70757a">tdx 已连接</text>
    <rect x="344" y="600" width="148" height="48" rx="8" fill="#fff" stroke="#9aa0a6"/><text x="418" y="620" text-anchor="middle">基本面</text><text x="418" y="638" text-anchor="middle" fill="#70757a">三表/一致预期</text>
    <rect x="500" y="600" width="148" height="48" rx="8" fill="#fff" stroke="#9aa0a6"/><text x="574" y="620" text-anchor="middle">新闻/事件/公告</text><text x="574" y="638" text-anchor="middle" fill="#70757a">KG 动态源</text>
    <rect x="656" y="600" width="148" height="48" rx="8" fill="#fff" stroke="#9aa0a6"/><text x="730" y="620" text-anchor="middle">宏观指标</text><text x="730" y="638" text-anchor="middle" fill="#70757a">wenda_macro</text>
    <rect x="812" y="600" width="148" height="48" rx="8" fill="#fff" stroke="#9aa0a6"/><text x="886" y="620" text-anchor="middle">研报/调研</text><text x="886" y="638" text-anchor="middle" fill="#70757a">抽取语料</text>
  </g>
  <text x="188" y="676" font-size="11" fill="#70757a">⚙ 所有角色取数后统一过 <tspan fill="#9a6a1a" font-weight="bold">DataValidator</tspan> 共享校验（金额交叉验证 / 元→亿元 / 敏感性反算）</text>

  <!-- ===== L6 工程层 Harness ===== -->
  <rect x="180" y="708" width="780" height="132" rx="10" fill="#ede7f6" stroke="#a142f4" stroke-width="1.5"/>
  <rect x="20" y="708" width="150" height="132" rx="10" fill="#a142f4"/>
  <text x="95" y="770" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">工程层</text>
  <text x="95" y="790" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Harness</text>
  <text x="95" y="812" text-anchor="middle" font-size="11" fill="#fff">可靠性/可观测</text>
  <g font-size="11.5" fill="#4a1d80">
    <rect x="188" y="720" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="262" y="745" text-anchor="middle">状态 Schema (Pydantic)</text>
    <rect x="344" y="720" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="418" y="745" text-anchor="middle">PromptHub 版本管理</text>
    <rect x="500" y="720" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="574" y="745" text-anchor="middle">Tool 契约 (入/出参)</text>
    <rect x="656" y="720" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="730" y="745" text-anchor="middle">重试 / 降级</text>
    <rect x="812" y="720" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="886" y="745" text-anchor="middle">可观测性 (trace)</text>
    <rect x="188" y="770" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="262" y="795" text-anchor="middle">Eval 体系</text>
    <rect x="344" y="770" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="418" y="795" text-anchor="middle">测试 (单/集成/混沌)</text>
    <rect x="500" y="770" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="574" y="795" text-anchor="middle">合规审计日志</text>
    <rect x="656" y="770" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="730" y="795" text-anchor="middle">成本护栏 / 确定性</text>
    <rect x="812" y="770" width="148" height="40" rx="8" fill="#fff" stroke="#a142f4"/><text x="886" y="795" text-anchor="middle">提示注入防护</text>
  </g>

  <!-- vertical flow chevrons between layers -->
  <g fill="#b8c0cc">
    <path d="M95 172 l8 10 l-8 10 l-8 -10 z"/>
    <path d="M95 280 l8 10 l-8 10 l-8 -10 z"/>
    <path d="M95 454 l8 10 l-8 10 l-8 -10 z"/>
    <path d="M95 566 l8 10 l-8 10 l-8 -10 z"/>
    <path d="M95 694 l8 10 l-8 10 l-8 -10 z"/>
  </g>
</svg>
